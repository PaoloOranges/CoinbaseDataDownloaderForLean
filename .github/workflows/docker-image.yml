name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]
  release:
    types: published

env:
  IMAGE_NAME: paolooranges/coinbase-data-downloader-for-lean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Determine next version from Docker Hub
      id: version
      run: |
        REPO="paolooranges/coinbase-data-downloader-for-lean"

        TAGS=$(curl -s "https://hub.docker.com/v2/repositories/$REPO/tags/?page_size=100" \
          | jq -r '.results[].name' \
          | grep -E '^[0-9]+$' || true)

        if [ -z "$TAGS" ]; then
          NEXT=1
        else
          HIGHEST=$(echo "$TAGS" | sort -n | tail -1)
          NEXT=$((HIGHEST + 1))
        fi

        echo "version=$NEXT" >> $GITHUB_OUTPUT

    - name: Login to Docker Hub
      uses: docker/login-action@v6
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'release' }}
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ${{ env.IMAGE_NAME }}:latest
